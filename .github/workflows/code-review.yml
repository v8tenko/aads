name: Gemini AI Code Reviewer

on:
  push:
    branches-ignore:
      - main

permissions: write-all

jobs:
  gemini-code-review:
    runs-on: ubuntu-latest
    if: |
      github.event.head_commit && 
      github.ref != 'refs/heads/main'
    steps:
      - name: PR Info
        run: |
          echo "Commit: ${{ github.event.head_commit.id }}"
          echo "Branch: ${{ github.ref }}"
          echo "Repository: ${{ github.repository }}"

      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get PR Details
        id: pr
        run: |
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${{ github.ref_name }})
          echo "head_sha=$(echo $PR_JSON | jq -r '.[0].head.sha')" >> $GITHUB_OUTPUT
          echo "base_sha=$(echo $PR_JSON | jq -r '.[0].base.sha')" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: truongnh1992/gemini-ai-code-reviewer@main
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.0-flash
          EXCLUDE: "*.md,*.txt,package-lock.json,*.yml,*.yaml"
